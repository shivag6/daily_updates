<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>user interface</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body {
    background: #fafafa;
    font-family: Arial, Helvetica, sans-serif;
}

.login-box {
    width: 350px;
    background: rgb(93, 50, 50);
    border: 1px solid #5d4848;
    padding: 40px 35px;
    margin: 40px auto 10px;
    text-align: center;
}

.logo {
    font-family: cursive;
    font-size: 40px;
    margin-bottom: 30px;
}

.form-control {
    background: #fafafa;
    border: 1px solid #ddd;
    margin-bottom: 8px;
    font-size: 14px;
}

.btn-login {
    background: #56857a;
    color: rgb(155, 113, 113);
    font-weight: bold;
    margin-top: 8px;
}

.btn-login:hover {
    background: #bdcbd6;
}

.divider {
    display: flex;
    align-items: center;
    margin: 15px 0;
    color: #888;
    font-size: 13px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #ddd;
    margin: 0 10px;
}

.fb-login {
    color: #d4dced;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

.forgot {
    font-size: 12px;
    color: #7d8a97;
    margin-top: 12px;
}

.signup-box {
    width: 350px;
    background: rgb(62, 45, 45);
    border: 1px solid #ddd;
    padding: 20px;
    margin: auto;
    text-align: center;
    font-size: 14px;
}

.signup-box a {
    color: #0095f6;
    font-weight: bold;
    text-decoration: none;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 30px;
}

.footer a {
    margin: 5px;
    color: #888;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">
    <div class="logo">Instagram</div>

    <form id="loginForm">
        <input type="text" class="form-control" id="username" placeholder="Phone number, username, or email">
        <input type="password" class="form-control" id="password" placeholder="Password">

        <button class="btn btn-login w-100" type="submit">Log in</button>
    </form>

    <div class="divider">OR</div>

    <div class="fb-login">Log in with Facebook</div>

    <div class="forgot">Forgot password?</div>
</div>

<div class="signup-box">
    account ilava osadh creat madu? <a href="#">Sign up</a>
</div>

<div class="footer">
    <select class="footer" aria-label="Default select example">

    <a href="#">Meta</a>
    <a href="#">About</a>
    <a href="#">Blog</a>
    <a href="#">Jobs</a>
    <a href="#">Help</a>
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
    <br>
</div>

<script>
$("#loginForm").submit(function(e){
    e.preventDefault();

    let user = $("#username").val().trim();
    let pass = $("#password").val().trim();

    if(user === "" || pass === ""){
        alert("Please fill all fields");
        return;
    }

    alert("Demo login successful!");
});
</script>

</body>
</html>
